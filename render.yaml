services:
  - type: web
    name: aketown
    runtime: node
    plan: starter
    buildCommand: echo "no build"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: DATA_FILE
        value: /var/data/aketown.json
    disk:
      name: aketown-data
      mountPath: /var/data
      sizeGB: 1
